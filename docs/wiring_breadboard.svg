<text x="690" y="430" text-anchor="middle" font-size="11" fill="#2e7d32">audio PCM</text>
<text x="690" y="496" text-anchor="middle" font-size="11" fill="#f57c00">commands S / X</text>
<text x="650" y="346" text-anchor="middle" font-size="11" fill="#212121">common GND</text>
<polyline points="390,664 360,664 360,752 855,752 855,530" fill="none" stroke="#c62828" stroke-width="4"/>
<circle cx="855" cy="530" r="6" fill="#c62828"/>
<text x="867" y="520" font-size="13" fill="#111">pin 1 · 5V</text>
<text x="620" y="746" text-anchor="middle" font-size="12" fill="#c62828">POWER: Flipper pin 1 (5V) → ESP32 5V pin (primary supply, no USB cable)</text>
<rect x="60" y="775" width="880" height="120" rx="8" fill="#fafafa" stroke="#bdbdbd"/>
<text x="76" y="799" font-size="14" font-weight="bold" fill="#333">Notes</text>
<text x="76" y="819" font-size="12" fill="#333">• TX and RX are crossed: Flipper TX (pin 13) → ESP32 RX2 (IO16); ESP32 TX2 (IO17) → Flipper RX (pin 14).</text>
<text x="76" y="837" font-size="12" fill="#333">• Any ESP32 GND pin works: they are all connected on the board. Use one for the Flipper and one (or the same) for the microphone.</text>
<text x="76" y="855" font-size="12" fill="#333">• Power: the red wire (Flipper 5V → ESP32 5V) is the primary supply; the app switches the 5 V rail on. Do not plug USB in at the same time.</text>
<text x="76" y="873" font-size="12" fill="#333">• The INMP441 is powered from the ESP32 3V3 pin. L/R tied to GND selects the left channel. USB is only for programming.</text>
<text x="76" y="891" font-size="12" fill="#333">• Check the labels on your own board: the round INMP441 module has the same six signals in a different layout.</text>
</svg>
